name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: synapse-distilled-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: synapse-distilled-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: synapse-distilled-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: synapse-distilled-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: synapse-distilled-macos-x64
          - os: ubuntu-latest
            target: aarch64-linux-android
            artifact: synapse-distilled-android-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Android linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${CLANG}" >> "$GITHUB_ENV"
          echo "TARGET_CC=${CLANG}" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${CLANG}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Paketle
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/synapse-distilled"
          if [[ "${{ matrix.target }}" == *windows* ]]; then src="$src.exe"; fi
          cp "$src" "${{ matrix.artifact }}"
          ls -la "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: synapse-distilled-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: synapse-distilled-*
