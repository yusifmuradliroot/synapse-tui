[package]
name = "synapse-distilled"
version = "1.0.0"
edition = "2021"
description = "Terminalde calisan evrensel AI kod asistani (Windows, Linux, macOS, Termux)"
license = "MIT"
repository = "https://github.com/yusifmuradliroot/synapse-tui"
autobins = false

[[bin]]
name = "synapse-distilled"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", features = ["rustls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
