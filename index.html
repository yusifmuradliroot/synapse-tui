<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion · Voice Agent</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=21">
</head>
<body data-state="standby">

<header class="top">
  <div class="brand">AURION<span class="tag">VOICE&nbsp;AGENT</span></div>
  <div class="top-status" id="micBadge">MIC: OFF</div>
</header>

<div class="wrap">
<main class="stage">
  <div class="agent">
    <div class="grid" id="grid"></div>

    <div class="bubble" id="bubble" hidden></div>
  </div>
</main>

<aside class="panel" hidden>
  <section>
    <h2>AGENT STATE</h2>
    <button class="state-btn" data-state="standby">
      <kbd>1</kbd>
      <span class="lbl">Standby</span>
      <span class="desc">idle animation</span>
    </button>
    <button class="state-btn" data-state="listening">
      <kbd>2</kbd>
      <span class="lbl">Listening</span>
      <span class="desc">live level meter</span>
    </button>
    <button class="state-btn" data-state="processing">
      <kbd>3</kbd>
      <span class="lbl">Processing</span>
      <span class="desc">model is working</span>
    </button>
    <button class="state-btn" data-state="speaking">
      <kbd>4</kbd>
      <span class="lbl">Speaking</span>
      <span class="desc">finished, anything else?</span>
    </button>
  </section>

  <section>
    <h2>WAKE WORD</h2>
    <p class="line" id="wakeStatus">wake-word: off</p>
    <div class="row">
      <button class="btn" id="btnVoice">ENABLE VOICE</button>
      <button class="btn" id="btnWake">SIM WAKE</button>
    </div>
    <div class="row">
      <button class="btn" id="btnMic">ENABLE MIC</button>
    </div>
  </section>

  <section>
    <h2>AUTORUN</h2>
    <div class="row">
      <button class="btn primary" id="btnAuto">RUN ALL</button>
      <button class="btn" id="btnStop">STOP</button>
    </div>
    <ol class="checks" id="checks">
      <li data-step="wake">wake-word "synapse"</li>
      <li data-step="listen">listen + level meter</li>
      <li data-step="process">processing</li>
      <li data-step="speak">speak response</li>
      <li data-step="back">back to standby</li>
    </ol>
  </section>

  <div class="log" id="log" aria-live="polite"></div>
</aside>
</div>

<script src="app.js?v=21"></script>
</body>
</html>
