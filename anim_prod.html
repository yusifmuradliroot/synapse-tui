<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>animation-production v1.2.0</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0000ff; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; display: block; }
  #hud-top, #hud-bot {
    position: fixed; left: 0; right: 0; z-index: 2;
    font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #fff; white-space: pre; pointer-events: none;
    padding: 6px 10px; text-shadow: 0 0 4px #000;
  }
  #hud-top { top: 0; }
  #hud-bot { bottom: 0; color: #ebebeb; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud-top" hidden></div>
<div id="hud-bot" hidden></div>
<script>
'use strict';
/* animation-production v1.2.0 — web port of animation-production.exe
   Blank(blue) -> Scan(custom 20% window) -> ScanFill(keep) -> CoinY(audio+lightning) -> Processing -> CoinY */
const VERSION = '1.2.0';
const TAU = Math.PI * 2;
const C30 = 0.8660254;

/* render grid (rebuilt on resize) */
let N = 121, CX = 60, CY = 60, R = 33;
const TRI_U = [[0, -1], [C30, 0.5], [-C30, 0.5]];
const TRI_D = [[0, 1], [C30, -0.5], [-C30, -0.5]];
const HX = C30 / 3;
const SOLID_PTS = [
  [0, -1], [C30, 0.5], [-C30, 0.5], [0, 1], [C30, -0.5], [-C30, -0.5],
  [-HX, -0.5], [HX, -0.5], [2 * HX, 0], [HX, 0.5], [-HX, 0.5], [-2 * HX, 0],
];
const RIM = [[0, 7, 8, 1], [1, 9, 10, 2], [2, 11, 6, 0], [3, 9, 8, 4], [4, 7, 6, 5], [5, 11, 10, 3]];
const HALF_EDGES = RIM.flatMap((s) => [[s[0], s[1]], [s[1], s[2]], [s[2], s[3]]]);
const RIM_SH = [200, 150, 105, 70, 120, 175];
const RIM_SH_BRIGHT = [245, 205, 175, 150, 190, 225];
const HD = 0.16, CAM = 6.2;

function pointInTri(px, py, t) {
  const [a, b, c] = t;
  const d = (b[1] - c[1]) * (a[0] - c[0]) + (c[0] - b[0]) * (a[1] - c[1]) || 1e-9;
  const u = ((b[1] - c[1]) * (px - c[0]) + (c[0] - b[0]) * (py - c[1])) / d;
  const v = ((c[1] - a[1]) * (px - c[0]) + (a[0] - c[0]) * (py - c[1])) / d;
  return u >= 0 && v >= 0 && u + v <= 1;
}
function pointInPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (yi > py !== yj > py && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function fillPoly(d, pts, v) {
  let x0 = N, y0 = N, x1 = -1, y1 = -1;
  for (const p of pts) {
    if (p[0] < x0) x0 = p[0];
    if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1];
    if (p[1] > y1) y1 = p[1];
  }
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(N - 1, Math.ceil(x1)); y1 = Math.min(N - 1, Math.ceil(y1));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (!pointInPoly(x + 0.5, y + 0.5, pts)) continue;
    const i = (y * N + x) * 4;
    d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
}

function drawPass(d, o) {
  const { thU, thD, sx, sy, ox, oy, pv, fx, t, scan } = o;
  const k = R / 20, cx = CX, cy = CY, r = R;
  const cu = Math.cos(thU), su = Math.sin(thU);
  const cd = Math.cos(thD), sd = Math.sin(thD);
  const map = (p, c, s) => {
    const X = (p[0] - pv[0]) * sx * c - (p[1] - pv[1]) * sy * s;
    const Y = (p[0] - pv[0]) * sx * s + (p[1] - pv[1]) * sy * c;
    return [cx + pv[0] * r + X * r + ox * k, cy + pv[1] * r + Y * r + oy * k];
  };
  const rU = TRI_U.map((p) => map(p, cu, su));
  const rD = TRI_D.map((p) => map(p, cd, sd));
  const search = Math.ceil(r * Math.max(Math.abs(sx), Math.abs(sy))) + 8;
  const x0 = Math.max(0, Math.floor(cx + ox * k - search)), x1 = Math.min(N - 1, Math.ceil(cx + ox * k + search));
  const y0 = Math.max(0, Math.floor(cy + oy * k - search)), y1 = Math.min(N - 1, Math.ceil(cy + oy * k + search));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const px = x + 0.5, py = y + 0.5;
    if (fx === 'scan') {
      const sc = scan >= 0 ? scan : ((t * 30) % (N + 28)) - 14;
      if (Math.abs(py - sc) > 7) continue;
    } else if (fx === 'scanfill') {
      const sc = scan >= 0 ? scan : ((t * 30) % (N + 28)) - 14;
      if (py > sc + 7) continue;
    } else if (fx === 'scanwindow') {
      const sc = scan >= 0 ? scan : ((t * 30) % (N + 28)) - 14;
      const win = 0.4 * r;
      if (py > sc || py < sc - win) continue;
    }
    if (!pointInTri(px, py, rU) && !pointInTri(px, py, rD)) continue;
    const i = (y * N + x) * 4;
    d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; d[i + 3] = 255;
  }
}

function drawSolid(d, t, axisX, darkBg, angle, rimGain) {
  const auto = t * 1.5;
  let a = angle == null ? auto : angle;
  if (angle == null) for (let i = 0; i < 4; i++) a += 0.004 * (0.5 + (1 - Math.abs(Math.cos(a))));
  const wob = 0.16 * Math.sin(t * 1.15), wob2 = 0.12 * Math.sin(t * 0.83 + 1.4);
  const ca = Math.cos(a), sa = Math.sin(a);
  const cw = Math.cos(wob), sw = Math.sin(wob);
  const cw2 = Math.cos(wob2), sw2 = Math.sin(wob2);
  const mv = (p, z) => {
    let x, y, zz;
    if (axisX) { x = p[0]; y = p[1] * ca + z * sa; zz = -p[1] * sa + z * ca; }
    else { x = p[0] * ca + z * sa; y = p[1]; zz = -p[0] * sa + z * ca; }
    const y2 = y * cw - zz * sw, z2 = y * sw + zz * cw;
    return [x * cw2 - y2 * sw2, x * sw2 + y2 * cw2, z2];
  };
  const proj = (v) => {
    const f = CAM / (CAM - v[2]);
    return [CX + v[0] * R * f, CY + v[1] * R * f, v[2]];
  };
  const F = SOLID_PTS.map((p) => proj(mv(p, HD)));
  const B = SOLID_PTS.map((p) => proj(mv(p, -HD)));
  const P3 = (v, i) => [v[i][0], v[i][1]];
  const gain = Math.min(1, Math.max(0, rimGain == null ? 1 : rimGain));
  if (gain > 0.02 && darkBg) {
    const bv = Math.round(55 * gain);
    fillPoly(d, [P3(B, 0), P3(B, 1), P3(B, 2)], bv);
    fillPoly(d, [P3(B, 3), P3(B, 4), P3(B, 5)], bv);
  }
  const rim = darkBg ? RIM_SH : RIM_SH_BRIGHT;
  const quads = HALF_EDGES.map(([i, j], nq) => ({
    pts: [P3(F, i), P3(F, j), P3(B, j), P3(B, i)],
    z: (F[i][2] + F[j][2] + B[i][2] + B[j][2]) / 4,
    v: Math.round(255 - (255 - rim[nq % 6]) * gain),
  })).sort((p, q) => p.z - q.z);
  for (const qd of quads) fillPoly(d, qd.pts, qd.v);
  fillPoly(d, [P3(F, 0), P3(F, 1), P3(F, 2)], 255);
  fillPoly(d, [P3(F, 3), P3(F, 4), P3(F, 5)], 255);
}

function audioFlash(d, amount, seed) {
  const a = Math.min(1, Math.max(0, amount * amount));
  if (a <= 0.01) return;
  for (let i = 0; i < N * N; i++) {
    const v = d[i * 4];
    if (v > 0) {
      const nv = Math.round(v + (255 - v) * a);
      d[i * 4] = nv; d[i * 4 + 1] = nv; d[i * 4 + 2] = nv;
    }
  }
  if (a > 0.35) {
    let h = (seed * 0x9E3779B1 + 0x85EBCA6B) >>> 0;
    const spikes = 2 + Math.floor(a * 6);
    for (let sN = 0; sN < spikes; sN++) {
      h = (h * 0x85EBCA6B + 0xC2B2AE35) >>> 0;
      const i = h % (N * N);
      if (d[i * 4] > 0) {
        d[i * 4] = 255; d[i * 4 + 1] = 255; d[i * 4 + 2] = 255;
        const x = i % N, y = (i / N) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
          const j = (ny * N + nx) * 4;
          if (d[j] < 200) {
            const nv = Math.min(255, Math.max(d[j], Math.round(200 + 55 * a)));
            d[j] = nv; d[j + 1] = nv; d[j + 2] = nv;
          }
        }
      }
    }
  }
}

/* ---------- phases ---------- */
const T_BLANK = 1.0, T_SWEEP = 2.2, T_SCANFILL = 2.6, T_FACE = 1.0, WHEEL_RATE = TAU;
const ease = (p) => { p = Math.min(1, Math.max(0, p)); return p * p * (3 - 2 * p); };
const angleRate = (a) => 1.5 * (0.5 + (1 - Math.abs(Math.cos(a))));

const BG = { blue: [0, 0, 255], black: [0, 0, 0], deep: [12, 18, 96] };
const BG_ORDER = ['blue', 'black', 'deep'];

const cvs = document.getElementById('cv');
const ctx = cvs.getContext('2d');
const hudTop = document.getElementById('hud-top');
const hudBot = document.getElementById('hud-bot');
let img = null;

function fitGrid() {
  const size = Math.min(innerWidth, innerHeight * 2);
  const n = Math.max(41, Math.min(121, Math.round(size)));
  N = n; CX = (n - 1) / 2; CY = (n - 1) / 2; R = n * 20 / 73;
  cvs.width = n; cvs.height = n;
  img = ctx.createImageData(n, n);
}
addEventListener('resize', fitGrid);
fitGrid();

let phase = 'blank', pt = 0, prevPt = 0;
let coinAngle = 0, enterAngle = 0, wheelTh = 0, flat = false;
let scanProg = 0, rimT = 0, flashW = 0;
let audio = 0, disp = 0;
let paused = false, hud = true, autoDemo = false;
let bgIdx = 0, sizeMul = 1, frameNo = 0;
let xfade = null;
let lastT = performance.now();

/* mic */
let analyser = null, timeData = null, micOn = false, micLive = false;
async function micStart() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('no webaudio');
    const ac = new AC();
    if (ac.state === 'suspended') await ac.resume();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    timeData = new Uint8Array(analyser.fftSize);
    micOn = true; micLive = true;
  } catch (e) { micOn = true; micLive = false; }
}
function micLevel() {
  if (!analyser) return null;
  analyser.getByteTimeDomainData(timeData);
  let sum = 0;
  for (let i = 0; i < timeData.length; i++) {
    const v = (timeData[i] - 128) / 128;
    sum += v * v;
  }
  return Math.min(1, Math.sqrt(sum / timeData.length) * 5.5);
}
/* synthetic fallback so the coin still breathes without a mic */
let synthT = 0;
function synthLevel(dt) {
  synthT += dt;
  return Math.min(1, Math.max(0, 0.18 + 0.62 * Math.abs(Math.sin(synthT * 1.7)) * Math.abs(Math.sin(synthT * 0.53))));
}

function setPhase(p) {
  if (p === phase) return;
  xfade = { snap: new Uint8ClampedArray(img.data), t0: 0 };
  phase = p; pt = 0; prevPt = 0;
  if (p === 'scan' || p === 'scanfill') scanProg = 0;
  if (p === 'processing') { enterAngle = coinAngle; wheelTh = 0; flat = false; }
}

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'p') setPhase(phase === 'processing' ? 'coiny' : 'processing');
  else if (k === 'r') {
    phase = 'blank'; pt = 0; prevPt = 0; scanProg = 0;
    coinAngle = 0; wheelTh = 0; flat = false; xfade = null;
    rimT = 0; flashW = 0; autoDemo = false;
  }
  else if (k === 'm') { if (micLive) { micOn = !micOn; } else micStart(); }
  else if (k === 'h') hud = !hud;
  else if (k === 'b') { bgIdx = (bgIdx + 1) % BG_ORDER.length; document.body.style.background = `rgb(${BG[BG_ORDER[bgIdx]].join(',')})`; }
  else if (k === '=' || k === '+') sizeMul = Math.min(1.5, sizeMul + 0.05);
  else if (k === '-' || k === '_') sizeMul = Math.max(0.3, sizeMul - 0.05);
  else if (k === 'd') { autoDemo = !autoDemo; if (autoDemo) setPhase('processing'); }
  else if (k === ' ') { e.preventDefault(); paused = !paused; }
});
micStart();

function blend(d, snap, k) {
  k = Math.min(1, Math.max(0, k));
  for (let i = 0; i < N * N; i++) {
    const o = d[i * 4];
    const nv = Math.round(snap[i * 4] * (1 - k) + o * k);
    d[i * 4] = nv; d[i * 4 + 1] = nv; d[i * 4 + 2] = nv;
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000) || 0.016;
  lastT = now;
  const t = now / 1000;
  if (!paused) pt += dt;

  if (micOn && micLive) {
    const v = micLevel();
    if (v != null) {
      const tau = v > audio ? 0.03 : 0.25;
      audio += (v - audio) * (1 - Math.exp(-dt / tau));
    }
  } else if (micOn) {
    const v = synthLevel(dt);
    const tau = v > audio ? 0.03 : 0.25;
    audio += (v - audio) * (1 - Math.exp(-dt / tau));
  } else {
    audio *= Math.exp(-dt / 0.4);
  }
  if (!paused) disp = audio;

  if (autoDemo && phase === 'processing' && pt > T_FACE + 4.0) setPhase('coiny');

  const prev = phase;
  if (phase === 'blank' && pt >= T_BLANK) setPhase('scan');
  else if (phase === 'scan' && scanProg >= 1) setPhase('scanfill');
  else if (phase === 'scanfill' && scanProg >= 1 && pt >= T_SCANFILL) setPhase('coiny');
  if (prev !== phase) { pt = 0; prevPt = 0; }

  if (!paused && (phase === 'scan' || phase === 'scanfill')) {
    scanProg = Math.min(1, scanProg + dt / T_SWEEP);
  }
  if (!paused) {
    if (phase === 'coiny') {
      coinAngle += angleRate(coinAngle) * dt;
      rimT += dt;
      flashW += (1 - flashW) * (1 - Math.exp(-dt / 0.4));
    } else if (phase === 'processing') {
      coinAngle += angleRate(coinAngle) * dt;
      if (flat) wheelTh += WHEEL_RATE * dt;
    }
  }
  if (!flat && phase === 'processing' && prevPt < T_FACE && pt >= T_FACE) {
    xfade = { snap: new Uint8ClampedArray(img.data), t0: pt };
    flat = true;
  }
  prevPt = pt;

  const d = img.data;
  d.fill(0);
  const dark = BG_ORDER[bgIdx] === 'black';
  const rimGain = ease(Math.min(1, rimT / 0.5));
  const sweep = (p) => -14 + (N + 28) * Math.min(1, Math.max(0, p));
  if (phase === 'scan') {
    drawPass(d, { thU: 0, thD: 0, sx: 1, sy: 1, ox: 0, oy: 0, pv: [0, 0], fx: 'scanwindow', t, scan: sweep(scanProg) });
  } else if (phase === 'scanfill') {
    drawPass(d, { thU: 0, thD: 0, sx: 1, sy: 1, ox: 0, oy: 0, pv: [0, 0], fx: 'scanfill', t, scan: sweep(scanProg) });
  } else if (phase === 'coiny') {
    drawSolid(d, t, false, dark, coinAngle, rimGain);
    audioFlash(d, disp * disp, frameNo);
  } else if (phase === 'processing') {
    if (flat) {
      drawPass(d, { thU: wheelTh, thD: wheelTh, sx: 1, sy: 1, ox: 0, oy: 0, pv: [0, 0], fx: null, t, scan: -1 });
    } else {
      const a = pt < T_FACE
        ? enterAngle + (Math.round(enterAngle / Math.PI) * Math.PI - enterAngle) * ease(pt / T_FACE)
        : coinAngle;
      drawSolid(d, t, false, dark, a, 1);
    }
  }
  if (xfade) {
    const k = ease((pt - xfade.t0) / 0.3);
    if (k >= 1) xfade = null;
    else blend(d, xfade.snap, k);
  }
  frameNo = (frameNo + 1) >>> 0;

  /* paint: star pixels white/gray, everything else the bg color */
  const bg = BG[BG_ORDER[bgIdx]];
  const out = ctx.createImageData(N, N);
  const od = out.data;
  for (let i = 0; i < N * N; i++) {
    const v = d[i * 4];
    if (v > 0) { od[i * 4] = v; od[i * 4 + 1] = v; od[i * 4 + 2] = v; od[i * 4 + 3] = 255; }
    else { od[i * 4] = bg[0]; od[i * 4 + 1] = bg[1]; od[i * 4 + 2] = bg[2]; od[i * 4 + 3] = 255; }
  }
  ctx.putImageData(out, 0, 0);

  if (hud && phase !== 'blank') {
    const bar = 22;
    const filled = Math.round(Math.min(1, Math.max(0, disp)) * bar);
    const meter = '#'.repeat(filled) + '.'.repeat(bar - filled);
    const micTxt = !micOn ? 'OFF' : (micLive ? 'LIVE' : 'SYNTH');
    hudTop.hidden = false; hudBot.hidden = false;
    hudTop.textContent =
      ` ANIMATION-PRODUCTION v${VERSION}  ${phase.toUpperCase()}  mic ${micTxt}  [${meter}] ${disp.toFixed(2)}${autoDemo ? '  [demo]' : ''}`;
    hudBot.textContent =
      ' p processing  r restart  m mic  h hud  b bg  +/- size  d demo';
  } else {
    hudTop.hidden = true; hudBot.hidden = true;
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
